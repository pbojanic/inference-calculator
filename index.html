<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Memory Calculator for LLM Inference</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="app"></div>

<!-- Data layer -->
<script src="models.js"></script>
<script src="calculator.js"></script>
<script src="gpus.js"></script>

<!-- Shared state & components -->
<script src="state.js"></script>
<script src="components/dialog.js"></script>
<script src="components/nav.js"></script>

<!-- Pages -->
<script src="pages/home.js"></script>
<script src="pages/model-detail.js"></script>
<script src="pages/gpus-page.js"></script>
<script src="pages/plan-page.js"></script>
<script src="pages/references-page.js"></script>
<script src="pages/settings-page.js"></script>

<!-- Router (must be last, triggers initial render) -->
<script src="router.js"></script>
<script>
    migrateLocalStorage();
    Router.init({
        home: renderHomePage,
        model: renderModelDetailPage,
        gpus: renderGpusPage,
        plan: renderPlanPage,
        references: renderReferencesPage,
        settings: renderSettingsPage
    });
</script>
</body>
</html>
